/* ══════════════════════════════════════════════════════════════════════════
   1. TOKENS
   The same Costa palette as the console, inverted for a light ground. The
   dark values ARE the console's values, so the inversion on slide 18 lands
   on exactly the colour the console is already painted in.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* brand constants — identical on both grounds */
  --accent:      #F9B000;   /* Costa yellow, Pantone 143 C */
  --costa-blue:  #0071A3;   /* Costa blue,   Pantone 7690 C */

  /* direction of travel on statistics.
     Amber is the default negative and keeps the deck inside the Costa
     palette. Alert and signal are held back for slide 15, where the gap
     between 0% and 82% is the content rather than a decoration. */
  --down:        #C77706;   /* Costa dark amber */
  --alert:       #C8503C;
  --signal:      #3FA675;

  /* ── light ground ── */
  --paper:       #F7F4EF;
  --ink:         #00324A;   /* Costa deep blue, set as type */
  --ink-soft:    #124A63;
  --mute:        #85888C;   /* Costa Cool Gray 8C */
  --rule:        rgba(0,50,74,.20);
  --frame:       rgba(0,50,74,.16);
  --panel:       rgba(0,50,74,.035);

  --sans: 'Poppins', 'Century Gothic', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --t-rise: 420ms;
  --t-rule: 500ms;
  --t-count: 900ms;
  --t-invert: 700ms;
  --ease-out: cubic-bezier(.22,.85,.3,1);
}

/* ── dark ground — the console's own palette ── */
body.is-dark{
  --paper:    #00324A;   /* === the console's ground */
  --ink:      #EBE9E8;
  --ink-soft: #C9D6DF;
  --mute:     #8DAAC9;
  --rule:     rgba(141,170,201,.30);
  --frame:    rgba(141,170,201,.26);
  --panel:    rgba(141,170,201,.06);
}

/* ══════════════════════════════════════════════════════════════════════════
   2. SHELL
   ══════════════════════════════════════════════════════════════════════════ */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

html,body{ height:100%; overflow:hidden; }

body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* The inversion is the only time colour animates. The class is added for
   its duration and removed again, so nothing else in the deck carries a
   colour transition it did not ask for. */
body.inverting,
body.inverting .canvas *{
  transition:
    background-color var(--t-invert) var(--ease-out),
    color            var(--t-invert) var(--ease-out),
    border-color     var(--t-invert) var(--ease-out),
    fill             var(--t-invert) var(--ease-out),
    stroke           var(--t-invert) var(--ease-out) !important;
}

/* ── the fixed design canvas ──
   Every slide is laid out inside 1280×720 and the whole thing is scaled to
   the viewport, so 1920×1080 and 1366×768 are the same picture at two
   sizes: no reflow, no scrolling, nothing the presenter did not rehearse. */
.viewport{ position:fixed; inset:0; overflow:hidden; background:var(--paper); }
.canvas{
  position:absolute; left:50%; top:50%;
  width:1280px; height:720px;
  transform:translate(-50%,-50%) scale(1);
  transform-origin:50% 50%;
}

:focus-visible{ outline:3px solid var(--accent); outline-offset:4px; border-radius:2px; }
:focus:not(:focus-visible){ outline:none; }

/* ══════════════════════════════════════════════════════════════════════════
   3. TYPE SCALE — nothing below 18px inside the canvas
   ══════════════════════════════════════════════════════════════════════════ */
.eyebrow{
  font-family:var(--mono); font-size:18px; font-weight:400;
  letter-spacing:.14em; text-transform:uppercase; color:var(--mute);
}
.src{
  font-family:var(--mono); font-size:18px; font-weight:400;
  line-height:1.5; color:var(--mute); letter-spacing:.005em;
}
.fig{
  font-family:var(--mono); font-weight:600; font-variant-numeric:tabular-nums;
  letter-spacing:-.02em; line-height:.9;
}

.display{ font-size:52px; font-weight:300; line-height:1.16; letter-spacing:-.02em; }
.headline{ font-size:56px; font-weight:600; line-height:1.1;  letter-spacing:-.025em; }
.title{    font-size:88px; font-weight:700; line-height:1;    letter-spacing:-.035em; }
.lead{     font-size:30px; font-weight:300; line-height:1.45; }
.body{     font-size:26px; font-weight:300; line-height:1.5;  color:var(--ink-soft); }
.small{    font-size:22px; font-weight:300; line-height:1.45; color:var(--ink-soft); }

.accent{ color:var(--accent); }
.down{ color:var(--down); }
b,strong{ font-weight:600; }

/* The yellow dot from the Costa guideline, carried over from the console. */
.dot{
  display:inline-block; width:.23em; height:.23em; border-radius:50%;
  background:var(--accent); vertical-align:baseline; margin-left:.06em;
}

/* ══════════════════════════════════════════════════════════════════════════
   4. MOTION SYSTEM — five effects, defined once, reused everywhere
   ══════════════════════════════════════════════════════════════════════════ */

/* 4.1 Rise-in — 12px up, opacity, 420ms, staggered 80ms across a group. */
[data-step]{
  opacity:0;
  transform:translateY(12px);
  transition:
    opacity   var(--t-rise) var(--ease-out),
    transform var(--t-rise) var(--ease-out);
  transition-delay:0ms;
}
[data-step].shown{
  opacity:1;
  transform:none;
  transition-delay:calc(var(--i, 0) * 80ms);
}

/* 4.3 Rule-draw — hairlines draw left to right rather than appearing. */
.rule{
  height:1px; width:100%; background:var(--rule);
  transform:scaleX(0); transform-origin:0 50%;
  transition:transform var(--t-rule) var(--ease-out);
}
.rule--v{ width:1px; height:100%; transform:scaleY(0); transform-origin:50% 0; }
[data-step].shown .rule,
.rule[data-step].shown{ transform:scaleX(1); }
[data-step].shown .rule--v,
.rule--v[data-step].shown{ transform:scaleY(1); }

/* 4.4 The loop rail — slides 07 to 11 only, fades rather than cuts. */
.rail{
  position:absolute; left:64px; right:64px; top:44px;
  display:flex; gap:0; align-items:flex-start;
  opacity:0; transition:opacity 420ms var(--ease-out);
  pointer-events:none;
}
.rail.on{ opacity:1; }
.rail__seg{ flex:1 1 0; display:flex; flex-direction:column; gap:10px; min-width:0; }
.rail__bar{
  height:3px; background:var(--frame);
  transition:background-color 420ms var(--ease-out);
}
.rail__seg + .rail__seg .rail__bar{ margin-left:6px; }
.rail__lbl{
  font-family:var(--mono); font-size:18px; letter-spacing:.06em;
  color:var(--frame); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:color 420ms var(--ease-out);
}
.rail__seg + .rail__seg .rail__lbl{ margin-left:6px; }
.rail__seg.is-past .rail__bar{ background:var(--rule); }
.rail__seg.is-past .rail__lbl{ color:var(--mute); }
.rail__seg.is-now  .rail__bar{ background:var(--accent); }
.rail__seg.is-now  .rail__lbl{ color:var(--accent); }

/* 4.5 The inversion is handled by the token swap above. */

/* Reduced motion: everything collapses to an instant opacity change. */
@media (prefers-reduced-motion:reduce){
  [data-step]{ transform:none; transition:opacity .001ms; transition-delay:0ms !important; }
  [data-step].shown{ transform:none; }
  .rule{ transform:scaleX(1); transition:none; }
  .rule--v{ transform:scaleY(1); }
  body.inverting, body.inverting .canvas *{ transition-duration:.001ms !important; }
  .rail{ transition:none; }
  .rail__bar,.rail__lbl{ transition:none; }
}

/* ══════════════════════════════════════════════════════════════════════════
   5. SLIDE CONTAINER
   ══════════════════════════════════════════════════════════════════════════ */
#slides{ position:absolute; inset:0; z-index:1; }
.rail{ z-index:3; }
.presenter{ z-index:3; }
.notes{ z-index:5; }

.slide{
  position:absolute; inset:0;
  padding:52px 72px 92px;
  display:none; flex-direction:column;
}
.slide.is-active{ display:flex; }

/* The five break-point slides give 52px of their height to the rail, so the
   whole sequence tightens together. Headline size is deliberately untouched:
   07 to 11 must read as one run. */
.tight .gap-m{ gap:20px; }
.tight .gap-s{ gap:14px; }
.tight .body { font-size:24px; }

/* Slides that carry more than the base scale fits in 720px step down one
   density notch, rather than the whole deck shrinking to its worst case. */
.dense .headline    { font-size:46px; }
.dense .display     { font-size:42px; }
.dense .lead        { font-size:26px; }
.dense .body        { font-size:24px; }
.dense .gap-l       { gap:26px; }
.dense .gap-m       { gap:22px; }
.dense .gap-s       { gap:14px; }
.dense .data-row__v { font-size:40px; }
.dense .quote       { font-size:36px; padding-left:26px; }
.dense .pair        { gap:56px; }
.dense .pair__n     { font-size:64px; }
.dense .pair__l     { font-size:20px; max-width:250px; }

/* content that steps aside once the argument has moved past it */
[data-until]{ transition:opacity 420ms var(--ease-out); }
[data-until].faded{ opacity:0; pointer-events:none; }
@media (prefers-reduced-motion:reduce){ [data-until]{ transition:opacity .001ms; } }
/* The rail bottoms out at 80px; 104 leaves it clear without spending the
   whole top of the slide on it. */
.slide.has-rail{ padding-top:104px; }
.slide.is-center{ justify-content:center; align-items:flex-start; }

/* vertical rhythm */
.stack   { display:flex; flex-direction:column; }
.gap-xs  { gap:12px; }  .gap-s{ gap:20px; }  .gap-m{ gap:32px; }
.gap-l   { gap:48px; }  .gap-xl{ gap:64px; }
.push    { margin-top:auto; }
.mw-sm{ max-width:720px; }  .mw-md{ max-width:900px; }  .mw-lg{ max-width:1040px; }

/* ══════════════════════════════════════════════════════════════════════════
   6. COMPONENTS
   ══════════════════════════════════════════════════════════════════════════ */

/* ── statistics ── the number is the hero ── */
.stat{ display:flex; flex-direction:column; gap:10px; }
.stat__n{ font-size:104px; }
.stat__n--sm{ font-size:76px; }
.stat__l{ font-size:24px; font-weight:300; line-height:1.4; color:var(--ink-soft); }
.stats-row{ display:flex; gap:56px; align-items:flex-start; }
.stats-row > *{ flex:1 1 0; min-width:0; }

/* two panes divided by a drawn hairline */
.split{ display:flex; gap:56px; align-items:stretch; }
.split > .col{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:20px; }
.split > .divider{ flex:0 0 1px; align-self:stretch; }

/* three columns divided by drawn hairlines */
.cols3{ display:flex; gap:44px; align-items:stretch; }
.cols3 > .col{ flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:16px; }
.cols3 > .divider{ flex:0 0 1px; }
.col__k{ font-size:34px; font-weight:600; letter-spacing:-.02em; }

/* ── slide 05 · the cycle ── */
.cycle{ display:flex; gap:14px; }
.cycle__b{
  flex:1 1 0; text-align:center;
  border:1px solid var(--frame); border-radius:3px;
  padding:20px 12px; font-size:24px; font-weight:400; letter-spacing:.01em;
}

/* ── slide 12 · the data row ── */
.data-row{ display:flex; gap:0; align-items:flex-end; }
.data-row__c{
  flex:1 1 0; min-width:0;
  display:flex; flex-direction:column; gap:8px; align-items:flex-start;
  padding-right:16px;
}
/* Kept below the 52px operational conclusion: on slide 12 the takeaway
   outweighs the data, not the other way round. */
.data-row__v{ font-size:44px; }
.data-row__k{
  font-family:var(--mono); font-size:18px; letter-spacing:.04em;
  color:var(--mute); white-space:nowrap;
}

/* ── slide 14 · the spiral ── */
.spiral{ display:flex; gap:64px; align-items:center; }
.spiral__svg{ flex:0 0 300px; width:300px; height:300px; }
.spiral__steps{ flex:1 1 auto; display:flex; flex-direction:column; gap:18px; }
.spiral__step{ display:flex; gap:18px; align-items:baseline; }
.spiral__n{
  font-family:var(--mono); font-size:18px; font-weight:600; color:var(--accent);
  flex:0 0 auto; width:22px;
}
.spiral__t{ font-size:24px; font-weight:300; line-height:1.4; color:var(--ink-soft); }
.sp-arc{
  fill:none; stroke:var(--accent); stroke-width:5; stroke-linecap:round;
  stroke-dasharray:176; stroke-dashoffset:176;
  transition:stroke-dashoffset 520ms var(--ease-out);
}
[data-step].shown .sp-arc, .sp-arc[data-step].shown{ stroke-dashoffset:0; }
.sp-node{ fill:var(--paper); stroke:var(--accent); stroke-width:4; }
.sp-track{ fill:none; stroke:var(--frame); stroke-width:5; }
@media (prefers-reduced-motion:reduce){ .sp-arc{ transition:none; stroke-dashoffset:0; } }

/* ── slide 15 · the sentence ── */
.quote{
  font-size:44px; font-weight:300; line-height:1.3; letter-spacing:-.015em;
  border-left:3px solid var(--accent); padding-left:32px;
}
.pair{ display:flex; gap:72px; align-items:flex-start; }
.pair__c{ display:flex; flex-direction:column; gap:10px; }
.pair__n{ font-size:96px; }
.pair__l{ font-size:22px; font-weight:300; line-height:1.4; color:var(--ink-soft); max-width:280px; }

/* ── slide 01 / 21 · the sentences ── */
.said{ font-size:46px; font-weight:300; line-height:1.28; letter-spacing:-.02em; }
.said--muted{ font-size:30px; color:var(--mute); }

/* ══════════════════════════════════════════════════════════════════════════
   7. PRESENTER CHROME — part of the design, not an overlay on top of it
   ══════════════════════════════════════════════════════════════════════════ */
.presenter{
  position:absolute; left:72px; bottom:40px;
  display:flex; align-items:center; gap:18px;
  font-family:var(--mono); font-size:18px; color:var(--mute);
  letter-spacing:.06em; font-variant-numeric:tabular-nums;
}
.presenter__n b{ color:var(--ink); font-weight:600; }
.presenter__n .of{ opacity:.6; }
.presenter__tick{ width:1px; height:16px; background:var(--rule); }
.presenter__hint{ opacity:.55; letter-spacing:.1em; }

/* speaker notes — hidden by default */
.notes{
  position:absolute; left:0; right:0; bottom:0;
  background:var(--paper);
  border-top:1px solid var(--rule);
  padding:26px 72px 30px;
  transform:translateY(101%);
  transition:transform 320ms var(--ease-out);
  max-height:360px; overflow-y:auto;
}
.notes.on{ transform:none; }
.notes__k{
  font-family:var(--mono); font-size:18px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--accent); margin-bottom:10px;
}
.notes__b{ font-size:22px; font-weight:300; line-height:1.5; color:var(--ink-soft); max-width:1040px; }
.notes__b em{ color:var(--ink); font-style:italic; }
@media (prefers-reduced-motion:reduce){ .notes{ transition:none; } }

/* ══════════════════════════════════════════════════════════════════════════
   8. THE HANDOFF
   Full-bleed at real viewport size — the console has its own responsive
   layout and must not be scaled inside the deck's 1280×720 canvas.
   It sits on the console's own ground colour, which by the time it appears
   is already the colour of the deck, so there is nothing to see happening.
   ══════════════════════════════════════════════════════════════════════════ */
.console{
  position:fixed; inset:0; width:100%; height:100%;
  border:0; background:#00324A;
  opacity:0; pointer-events:none;
  transition:opacity 420ms var(--ease-out);
  z-index:40;
}
.console.on{ opacity:1; pointer-events:auto; }
@media (prefers-reduced-motion:reduce){ .console{ transition:none; } }

/* Shown instead of the frame when the console has to open in a new tab. */
.fallback{ display:none; }
.fallback.on{ display:block; }
</style>

/* ══════════════════════════════════════════════════════════════════════════
   ENGINE — canvas scaling, reveals, the rail, the inversion, the handoff.
   No presentation copy below this line.
   ══════════════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)');

const CONSOLE_FILE = 'broken-loop.html';
const INVERT_MS = 700;

let idx = 0;          /* slide index */
let step = 0;         /* reveal step within the slide */
let dark = false;     /* current ground */
let notesOn = false;
let startedAt = null;
let consoleReady = false;
let consoleMode = null;   /* null | 'frame' | 'tab' */

/* ── 1. the design canvas ──────────────────────────────────────────────────
   1280×720 scaled to the viewport, recalculated on load and on resize, so
   1920×1080 and 1366×768 are the same picture at two sizes. */
function fit(){
  const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
  $('canvas').style.transform = `translate(-50%,-50%) scale(${s})`;
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);

/* ── 2. build ──────────────────────────────────────────────────────────── */
function build(){
  $('slides').innerHTML = SLIDES.map((s, i) => `
    <section class="slide${s.center ? ' is-center' : ''}${s.rail ? ' has-rail' : ''}${s.cls ? ' ' + s.cls : ''}"
             data-i="${i}" aria-label="Slide ${s.n}">${s.html}</section>`).join('');

  $('rail').innerHTML = RAIL.map(name => `
    <div class="rail__seg">
      <div class="rail__bar"></div>
      <div class="rail__lbl">${name}</div>
    </div>`).join('');
}

/* ── 3. reveals ────────────────────────────────────────────────────────── */
function countUp(node, animate){
  if (node.dataset.done === '1') return;
  node.dataset.done = '1';
  const target = +node.dataset.count;
  const suffix = node.dataset.suffix || '';
  if (!animate || REDUCED.matches || target === 0){
    node.textContent = target + suffix;
    return;
  }
  const t0 = performance.now();
  (function tick(now){
    const p = Math.min((now - t0) / 900, 1);
    const e = 1 - Math.pow(1 - p, 3);
    node.textContent = Math.round(target * e) + suffix;
    if (p < 1) requestAnimationFrame(tick);
    else node.textContent = target + suffix;
  })(performance.now());
}

function resetCounts(scope){
  scope.querySelectorAll('[data-count]').forEach(n => {
    n.dataset.done = '';
    n.textContent = '0' + (n.dataset.suffix || '');
  });
}

function stagger(el){
  const v = getComputedStyle(el).getPropertyValue('--i');
  return (parseFloat(v) || 0) * 80;
}

function applyStep(slideEl, animate){
  slideEl.querySelectorAll('[data-step]').forEach(el => {
    const show = +el.dataset.step <= step;
    if (!show && el.classList.contains('shown')) resetCounts(el);
    el.classList.toggle('shown', show);
  });

  /* elements that step aside once the argument has moved past them */
  slideEl.querySelectorAll('[data-until]').forEach(el => {
    el.classList.toggle('faded', step > +el.dataset.until);
  });

  slideEl.querySelectorAll('[data-step].shown').forEach(el => {
    const delay = animate ? stagger(el) : 0;
    const nodes = el.matches('[data-count]') ? [el] : el.querySelectorAll('[data-count]');
    nodes.forEach(n => {
      if (n.dataset.done === '1') return;
      if (delay) setTimeout(() => countUp(n, animate), delay);
      else countUp(n, animate);
    });
  });
}

/* ── 4. the rail ───────────────────────────────────────────────────────── */
function setRail(pos){
  const rail = $('rail');
  rail.classList.toggle('on', pos > 0);
  [...rail.children].forEach((seg, i) => {
    const n = i + 1;
    const all = pos === 5;                       /* slide 11: all five lit */
    seg.classList.toggle('is-now',  all || n === pos);
    seg.classList.toggle('is-past', !all && n < pos);
  });
}

/* ── 5. the inversion ──────────────────────────────────────────────────────
   The deck is dark from the moment it arrives at slide 18 until slide 19
   takes its first step. Deriving it from position rather than tracking it
   as an event means every route — forward, back, reset — lands correctly. */
function wantsDark(i, s){
  const n = SLIDES[i].n;
  return n === '18' || (n === '19' && s === 0);
}

let invertTimer = null;
function setGround(next, animate){
  if (next === dark) return;
  dark = next;
  if (animate && !REDUCED.matches){
    document.body.classList.add('inverting');
    clearTimeout(invertTimer);
    invertTimer = setTimeout(() => document.body.classList.remove('inverting'), INVERT_MS + 60);
  }
  document.body.classList.toggle('is-dark', dark);
}

/* ── 6. navigation ─────────────────────────────────────────────────────── */
function render(animate){
  const s = SLIDES[idx];
  const slides = $('slides').children;

  [...slides].forEach((el, i) => el.classList.toggle('is-active', i === idx));
  applyStep(slides[idx], animate);
  setRail(s.rail || 0);
  setGround(wantsDark(idx, step), animate);

  $('p-n').textContent = s.n;
  $('notes-k').textContent = 'Slide ' + s.n;
  $('notes-b').innerHTML = s.notes || '';
}

function go(i, s, animate = true){
  const prev = idx;
  idx = Math.max(0, Math.min(SLIDES.length - 1, i));
  step = s;
  if (prev !== idx) resetCounts($('slides').children[idx]);
  render(animate);
}

function setStep(s){
  step = s;
  render(true);
}

function advance(){
  startClock();
  if (consoleMode) return;                 /* the console has the floor */
  const s = SLIDES[idx];
  if (step < s.steps){
    setStep(step + 1);
    if (s.handoffAt && step === s.handoffAt) handoff();
  } else if (idx < SLIDES.length - 1){
    go(idx + 1, 0);
  }
}

function back(){
  startClock();
  if (consoleMode){ returnFromConsole(); return; }
  if (step > 0){ setStep(step - 1); return; }
  if (idx > 0){
    const prev = SLIDES[idx - 1];
    go(idx - 1, prev.steps);
  }
}

/* ── 7. the handoff ────────────────────────────────────────────────────────
   Preferred route is the embedded frame, so the presenter never leaves the
   deck. Local-file frames are cross-origin, so the console announces itself
   with postMessage; if that handshake never arrives the frame is not usable
   and we open the console in a tab instead rather than showing a dead frame. */
window.addEventListener('message', e => {
  const d = e.data;
  if (!d || typeof d !== 'object') return;
  if (d.type === 'broken-loop:ready') consoleReady = true;
  if (d.type === 'broken-loop:return') returnFromConsole();
});

function handoff(){
  const frame = $('console');
  if (consoleReady){
    consoleMode = 'frame';
    frame.classList.add('on');
    $('p-hint').textContent = 'Esc returns to the deck';
    setTimeout(() => { try { frame.contentWindow.focus(); } catch (err) {} }, 80);
  } else {
    /* The frame never announced itself, so it is not usable. Open the console
       in a tab instead of leaving a dead frame on screen. */
    consoleMode = 'tab';
    $('p-hint').textContent = 'Esc returns to the deck';
    const win = window.open(CONSOLE_FILE, '_blank');
    if (!win){
      /* Popup blocked — tell the presenter rather than failing silently. */
      const note = document.getElementById('handoff-fallback');
      if (note) note.classList.add('on');
    }
  }
}

function returnFromConsole(){
  const frame = $('console');
  frame.classList.remove('on');
  consoleMode = null;
  $('p-hint').textContent = 'N notes · F full screen';
  /* Slide 19 opens on the dark ground, which is the colour already on
     screen, so nothing flashes as the console goes. */
  go(SLIDES.findIndex(s => s.n === '19'), 0);
  window.focus();
}

/* ── 8. presenter chrome ───────────────────────────────────────────────── */
function startClock(){
  if (startedAt) return;
  startedAt = Date.now();
  tickClock();
}

function tickClock(){
  if (!startedAt) return;
  const t = Math.floor((Date.now() - startedAt) / 1000);
  $('p-clock').textContent =
    String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
}
/* Sampled well inside the second so the displayed minute never lags the
   real one on a shared screen. */
setInterval(tickClock, 250);

function toggleNotes(){
  notesOn = !notesOn;
  $('notes').classList.toggle('on', notesOn);
}

function toggleFull(){
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
}

function reset(){
  if (consoleMode){ $('console').classList.remove('on'); consoleMode = null; }
  $('p-hint').textContent = 'N notes · F full screen';
  startedAt = null;
  $('p-clock').textContent = '00:00';
  [...$('slides').children].forEach(resetCounts);
  notesOn = false; $('notes').classList.remove('on');
  go(0, 0, false);
}

/* ── 9. input ──────────────────────────────────────────────────────────── */
const NAV = [' ', 'Spacebar', 'ArrowRight', 'ArrowLeft', 'PageDown', 'PageUp'];

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (NAV.includes(k)) e.preventDefault();

  if (k === 'ArrowRight' || k === ' ' || k === 'Spacebar' || k === 'PageDown'){ advance(); return; }
  if (k === 'ArrowLeft'  || k === 'PageUp'){ back(); return; }
  if (k === 'Escape'){
    if (consoleMode) returnFromConsole();
    else if (notesOn) toggleNotes();
    return;
  }
  switch (k.toLowerCase()){
    case 'n': toggleNotes(); break;
    case 'f': toggleFull(); break;
    case 'r': reset(); break;
  }
});

/* Click advances, except on the notes panel and the presenter strip. */
$('canvas').addEventListener('click', e => {
  if (e.target.closest('.notes') || e.target.closest('.presenter')) return;
  advance();
});

/* ── 10. boot ──────────────────────────────────────────────────────────── */
build();
fit();
render(false);

/* Preload the console so the handoff has nothing left to load. */
$('console').src = CONSOLE_FILE;

</script>
</body>
</html>
