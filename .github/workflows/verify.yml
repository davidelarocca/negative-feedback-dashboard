name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # The two HTML files are generated. If a rebuild changes them, someone
      # edited the output instead of src/ — or forgot to rebuild after editing.
      - name: Rebuild and check the committed output is current
        run: |
          pip install --quiet pillow
          python3 tools/build.py
          git diff --exit-code -- broken-loop.html broken-loop-deck.html

      - name: Install Playwright
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Verify both files in a browser
        run: npm test
